name: Manual Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'qa'
        type: choice
        options:
        - dev
        - qa
        - prod
      version:
        description: 'Versión (ej: 1.0.17)'
        required: true
        default: '1.0.17'
      release_notes:
        description: 'Notas de la versión'
        required: false
        default: 'Nueva versión del Devocionario San José'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build Release
      id: build
      run: |
        if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
          ./gradlew assembleDevDebug
          echo "apk-path=app/build/outputs/apk/dev/debug/app-dev-debug.apk" >> $GITHUB_OUTPUT
          echo "app-id=${{ secrets.FIREBASE_APP_ID_DEV }}" >> $GITHUB_OUTPUT
          echo "testers-group=dev-testers" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
          ./gradlew bundleDevRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          echo "apk-path=app/build/outputs/bundle/devRelease/app-dev-release.aab" >> $GITHUB_OUTPUT
          echo "app-id=${{ secrets.FIREBASE_APP_ID_DEV }}" >> $GITHUB_OUTPUT
          echo "testers-group=qa-testers" >> $GITHUB_OUTPUT
        else
          ./gradlew bundleProdRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          echo "apk-path=app/build/outputs/bundle/prodRelease/app-prod-release.aab" >> $GITHUB_OUTPUT
          echo "app-id=${{ secrets.FIREBASE_APP_ID_PROD }}" >> $GITHUB_OUTPUT
          echo "testers-group=production-testers" >> $GITHUB_OUTPUT
        fi
        
    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ steps.build.outputs.app-id }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: ${{ steps.build.outputs.testers-group }}
        file: ${{ steps.build.outputs.apk-path }}
        releaseNotes: |
          🚀 Release Manual - ${{ github.event.inputs.environment }}
          📱 Devocionario San José v${{ github.event.inputs.version }}
          🔄 Commit: ${{ github.sha }}
          👤 Autor: ${{ github.actor }}
          📝 Notas: ${{ github.event.inputs.release_notes }}
          
    - name: Create GitHub Release
      if: github.event.inputs.environment == 'prod'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: Release v${{ github.event.inputs.version }}
        body: |
          🎉 Nueva versión de Devocionario San José
          
          **Versión:** ${{ github.event.inputs.version }}
          **Entorno:** ${{ github.event.inputs.environment }}
          
          **Notas de la versión:**
          ${{ github.event.inputs.release_notes }}
          
          **Descarga:**
          - AAB disponible en Firebase App Distribution
          - Grupo: ${{ steps.build.outputs.testers-group }}
        draft: false
        prerelease: false
